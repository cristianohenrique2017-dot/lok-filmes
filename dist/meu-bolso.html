<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Bolso</title>
<meta name="description" content="Controle financeiro pessoal: contas, cartões, orçamento e relatórios.">
<meta name="theme-color" content="#12a150">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Bolso">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Meu Bolso — estilos. Verde de marca, superfícies claras e escuras via tokens. */
:root {
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --outer: #dde5e0;
  --bg: #eef2ef;
  --surface: #ffffff;
  --surface2: #f4f7f5;
  --line: #e2e8e4;
  --fg: #0e1f16;
  --muted: #5f7167;
  --brand: #12a150;
  --brand-press: #0e8a43;
  --on-brand: #ffffff;
  --tint: #e3f5ea;
  --hdr: #12a150;
  --hdr2: #0d8a42;
  --pos: #0b8a43;
  --neg: #d92d45;
  --warn: #c97800;
  --info: #2f63e0;
  --ft-e: #d9344d;
  --ft-i: #12a150;
  --ft-t: #2f63e0;
  --shadow: 0 1px 2px rgba(14, 31, 22, .06), 0 6px 18px rgba(14, 31, 22, .06);
  --shadow-up: 0 -6px 24px rgba(14, 31, 22, .08);
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --outer: #000000;
    --bg: #0a0c0b;
    --surface: #151918;
    --surface2: #1d2221;
    --line: #272d2b;
    --fg: #eef4f0;
    --muted: #92a498;
    --brand: #1fb35d;
    --brand-press: #19a054;
    --tint: #12291c;
    --hdr: #0d5a31;
    --hdr2: #0a4727;
    --pos: #3ddc84;
    --neg: #ff6b7d;
    --warn: #f5b13d;
    --info: #7aa2ff;
    --ft-e: #9b2638;
    --ft-i: #0d6a38;
    --ft-t: #2b4fa8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow-up: 0 -6px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --outer: #000000;
  --bg: #0a0c0b;
  --surface: #151918;
  --surface2: #1d2221;
  --line: #272d2b;
  --fg: #eef4f0;
  --muted: #92a498;
  --brand: #1fb35d;
  --brand-press: #19a054;
  --tint: #12291c;
  --hdr: #0d5a31;
  --hdr2: #0a4727;
  --pos: #3ddc84;
  --neg: #ff6b7d;
  --warn: #f5b13d;
  --info: #7aa2ff;
  --ft-e: #9b2638;
  --ft-i: #0d6a38;
  --ft-t: #2b4fa8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-up: 0 -6px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--outer); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; text-rendering: optimizeLegibility;
}
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; touch-action: manipulation; }
input, select, textarea { outline: none; }
h1, h2, h3, h4, p { margin: 0; }
small { font-size: 12px; }
.ic { flex: none; display: block; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .info { color: var(--info); } .muted { color: var(--muted); }
.flipy { transform: scaleY(-1); } .rot90 { transform: rotate(90deg); }
input[type="date"] { min-height: 22px; }
input[type="search"]::-webkit-search-cancel-button { display: none; }

/* ---------- estrutura ---------- */
.app {
  position: relative; max-width: 520px; margin: 0 auto; min-height: 100dvh; background: var(--bg);
  padding-bottom: calc(92px + env(safe-area-inset-bottom)); box-shadow: 0 0 0 1px var(--line);
}
body.subpage .app { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.page { padding: 0 16px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; }
.page.pull { margin-top: -16px; position: relative; }

/* ---------- cabeçalho ---------- */
.hdr {
  background: linear-gradient(170deg, var(--hdr), var(--hdr2)); color: #fff;
  padding: calc(14px + env(safe-area-inset-top)) 18px 34px; display: flex; flex-direction: column; gap: 14px;
}
.hdr-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.hdr h1 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.hdr.sub { padding-bottom: 30px; }
.hdr.sub h1 { flex: 1; text-align: left; margin-left: 4px; }
.hdr-title { display: flex; flex-direction: column; min-width: 0; }
.hdr-title small { color: rgba(255, 255, 255, .78); font-weight: 500; }
.hdr-actions { display: flex; gap: 8px; }
.ibtn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .16); color: #fff; transition: background .15s, transform .1s; flex: none; }
.ibtn:active { transform: scale(.93); background: rgba(255, 255, 255, .28); }
.ibtn.flat { background: transparent; color: var(--fg); }
.ibtn.flat:active { background: var(--surface2); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; text-align: left; }
.who small { display: block; color: rgba(255, 255, 255, .8); font-size: 12px; }
.who b { display: block; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.me { width: 42px; height: 42px; border-radius: 50%; background: rgba(255, 255, 255, .22); display: grid; place-items: center; font-weight: 800; font-size: 17px; color: #fff; flex: none; border: 2px solid rgba(255, 255, 255, .5); }
.me.big { width: 56px; height: 56px; font-size: 22px; background: var(--tint); color: var(--brand); border-color: var(--brand); }

.mt { display: flex; justify-content: center; align-items: flex-end; gap: 6px; }
.mt button { padding: 6px 12px; color: rgba(255, 255, 255, .68); font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; transition: color .15s; }
.mt button.on { color: #fff; font-weight: 800; font-size: 15px; border-bottom-color: #fff; }

.bal { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.bal small { display: block; color: rgba(255, 255, 255, .8); font-size: 12px; }
.bal strong { display: block; font-size: 32px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.bal .proj { margin-top: 2px; }
.bal .proj b { color: #fff; font-variant-numeric: tabular-nums; }
.bal .more { display: flex; align-items: center; gap: 2px; color: #fff; font-weight: 700; font-size: 13px; padding: 8px 4px 8px 10px; border-radius: 10px; }

/* ---------- cartões e blocos ---------- */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.card.flush { padding: 0; overflow: hidden; }
.card.soft { background: var(--tint); box-shadow: none; }
.card.slim { display: flex; align-items: center; gap: 12px; padding: 14px 16px; color: var(--muted); font-size: 13.5px; }
.card.slim .ic { color: var(--brand); }
.card.welcome { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.card.welcome h2 { font-size: 20px; font-weight: 800; }
.card.welcome p { color: var(--muted); }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); text-align: left; min-width: 0; }
.stat > span:last-child { min-width: 0; }
.stat small { display: block; color: var(--muted); font-size: 12px; }
.stat b { display: block; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.si { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, currentColor 14%, var(--surface)); }

.sec { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.sec h2 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.sec.first { margin-top: 20px; }
.lnk { color: var(--brand); font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; gap: 4px; padding: 6px 2px; }
.hint { color: var(--muted); font-size: 12px; font-weight: 600; }
.foot { text-align: center; color: var(--muted); font-size: 12px; padding: 14px 0 6px; line-height: 1.6; }

.note { background: var(--tint); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; color: var(--fg); }
.note > div:first-child { display: flex; gap: 10px; align-items: flex-start; }
.note .ic { color: var(--brand); margin-top: 2px; }
.note p { font-size: 13.5px; }
.note-btns { display: flex; gap: 8px; justify-content: flex-end; }
.note.ok { flex-direction: row; align-items: center; justify-content: space-between; }

.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; text-align: left; font-size: 13.5px; background: color-mix(in srgb, var(--warn) 14%, var(--surface)); color: var(--fg); }
.alert > span { flex: 1; }
.alert .ic:first-child { color: var(--warn); }
.alert.over { background: color-mix(in srgb, var(--neg) 12%, var(--surface)); }
.alert.over .ic:first-child { color: var(--neg); }

.hscroll { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 10px; scroll-snap-type: x proximity; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.up { flex: none; width: 212px; background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; scroll-snap-align: start; text-align: left; }
.up-top { display: flex; gap: 10px; align-items: center; min-width: 0; }
.up-t { min-width: 0; }
.up-t b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up-t small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up-b { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.up-b small { color: var(--muted); font-weight: 600; }
.up-b small.late { color: var(--neg); }
.up-b b { font-size: 15px; font-variant-numeric: tabular-nums; }
.up .ci { width: 34px; height: 34px; }

.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.quick button { background: var(--surface); border-radius: 16px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; box-shadow: var(--shadow); color: var(--fg); }
.quick .ic { color: var(--brand); }

/* ---------- listas ---------- */
.list { display: flex; flex-direction: column; }
.day { display: flex; align-items: baseline; justify-content: space-between; margin: 10px 2px -6px; font-weight: 700; font-size: 13px; color: var(--muted); text-transform: capitalize; }
.day small { font-weight: 700; font-variant-numeric: tabular-nums; }
.day + .list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); background: transparent; transition: background .12s; }
.row:last-child { border-bottom: 0; }
.row:active { background: var(--surface2); }
.row.sel { background: var(--tint); }
.rm { min-width: 0; display: block; }
.rt { display: block; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rs { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.ra { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
.ra small { color: var(--muted); font-size: 11.5px; }
.amt { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.pend { opacity: .72; }
.amt.acc { color: var(--fg); }
.rep { display: inline-flex; vertical-align: -2px; color: var(--muted); margin-left: 2px; }

.ci { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; position: relative; flex: none; background: color-mix(in srgb, var(--c, var(--brand)) 15%, var(--surface)); color: var(--c, var(--brand)); }
.ci.sm { width: 34px; height: 34px; }
.st { position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--surface); color: #fff; font-style: normal; }
.st.ok { background: var(--brand); }
.st.pend { background: var(--warn); }
.st.late { background: var(--neg); }
.av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: .02em; flex: none; text-transform: uppercase; }

.search { display: flex; gap: 10px; margin-top: 20px; }
.search.pad { padding: 0 16px 10px; margin-top: 0; }
.sbox { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 14px; padding: 0 14px; box-shadow: var(--shadow); color: var(--muted); height: 46px; }
.sbox input { flex: 1; min-width: 0; border: 0; background: transparent; height: 100%; color: var(--fg); }
.sq { width: 46px; height: 46px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--muted); }
.search.pad .sbox { box-shadow: none; background: var(--surface2); }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; font-size: 13px; color: var(--fg); white-space: nowrap; }
.chip.on { background: var(--brand); color: var(--on-brand); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.sel { position: relative; display: block; }
.sel select { appearance: none; -webkit-appearance: none; width: 100%; background: var(--surface); border: 0; border-radius: 14px; padding: 12px 38px 12px 14px; box-shadow: var(--shadow); font-weight: 600; color: var(--fg); }
.sel > .ic { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }

.seg { display: flex; background: var(--surface); border-radius: 14px; padding: 4px; box-shadow: var(--shadow); gap: 2px; }
.seg button { flex: 1; padding: 9px 6px; border-radius: 10px; font-weight: 700; font-size: 13px; color: var(--muted); text-align: center; transition: background .15s, color .15s; }
.seg button.on { background: var(--brand); color: var(--on-brand); }
.card > .seg { box-shadow: none; background: var(--surface2); }

.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 34px 20px; color: var(--muted); }
.empty .ic { color: var(--brand); opacity: .8; }
.empty b { color: var(--fg); font-size: 16px; }
.empty p { max-width: 280px; font-size: 13.5px; }

/* ---------- botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border-radius: 14px; font-weight: 700; font-size: 15px; text-align: center; transition: transform .1s, background .15s; min-height: 48px; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.primary:active { background: var(--brand-press); }
.btn.ghost { background: var(--surface2); color: var(--fg); }
.btn.danger { background: var(--neg); color: #fff; }
.btn.danger-o { background: color-mix(in srgb, var(--neg) 12%, var(--surface)); color: var(--neg); }
.btn.plain { color: var(--muted); }
.btn.mini { padding: 8px 14px; min-height: 36px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn.grow { flex: 1; }
.btn.file { cursor: pointer; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.switch { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.switch.on { background: var(--brand); }
.switch.on i { transform: translateX(18px); }

/* ---------- navegação inferior ---------- */
.nav {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(520px, 100%); z-index: 20;
  display: grid; grid-template-columns: 1fr 1fr 78px 1fr 1fr; align-items: end;
  background: var(--surface); box-shadow: var(--shadow-up); border-top: 1px solid var(--line);
  padding: 6px 6px calc(8px + env(safe-area-inset-bottom));
}
body.subpage .nav { display: none; }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: 11px; font-weight: 600; border-radius: 12px; }
.nav button.on { color: var(--brand); }
.nav button small { font-size: 11px; }
.nav .fab { width: 58px; height: 58px; border-radius: 50%; background: var(--brand); color: #fff; margin: -26px auto 4px; display: grid; place-items: center; box-shadow: 0 6px 18px color-mix(in srgb, var(--brand) 45%, transparent); border: 4px solid var(--surface); padding: 0; transition: transform .12s; }
.nav .fab:active { transform: scale(.92); }

/* ---------- orçamento ---------- */
.sumcard { display: flex; flex-direction: column; gap: 10px; }
.sum-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sum-top small { display: block; color: var(--muted); }
.sum-top b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.bar { display: block; height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.bar.thin { height: 5px; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--brand)); transition: width .4s cubic-bezier(.2, .8, .2, 1); }
.bar i.ok { background: var(--c, var(--brand)); }
.bar i.warn { background: var(--warn); }
.bar i.over { background: var(--neg); }
.sumcard .bar i.ok { background: var(--brand); }
.pct { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.pct.ok { background: var(--tint); color: var(--pos); }
.pct.warn { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); color: var(--warn); }
.pct.over { background: color-mix(in srgb, var(--neg) 14%, var(--surface)); color: var(--neg); }
.pct.big { font-size: 18px; padding: 6px 14px; }
.brow { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 14px; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
.brow:last-child { border-bottom: 0; }
.brow:active { background: var(--surface2); }
.bm { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.bt { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bt b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bm small { color: var(--muted); font-size: 12px; }
.bal503020 { display: flex; flex-direction: column; gap: 16px; }
.eq { display: flex; flex-direction: column; gap: 6px; }
.eq-t { display: flex; justify-content: space-between; font-size: 14px; }
.eq-t span { font-weight: 800; font-variant-numeric: tabular-nums; }
.eq-b { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
.eq-b small:first-child { flex: 1; }
.eq-b b { color: var(--fg); font-variant-numeric: tabular-nums; }

/* ---------- relatórios ---------- */
.donut-card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.donut-wrap { position: relative; width: 220px; max-width: 70%; }
.donut { width: 100%; height: auto; display: block; }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.donut-c small { color: var(--muted); }
.donut-c b { font-size: 20px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.delta { font-weight: 700; }
.legend details { border-bottom: 1px solid var(--line); }
.legend details:last-child { border-bottom: 0; }
.legend summary { list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
.legend summary::-webkit-details-marker { display: none; }
.legend summary b { font-variant-numeric: tabular-nums; font-size: 14.5px; }

(function (G) {
  'use strict';
  var U = {};

  var MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var MESES_CURTOS = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  var DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];

    { name: 'Itaú', color: '#ff6200', fg: '#fff', short: 'itaú' },

<script>
/* Estado do app: persistência em localStorage, mutações e consultas (saldos, faturas, totais). */
(function (G) {
  'use strict';
  var KEY = 'meubolso:v1';
  var state = null, subs = [], timer = null, mem = null;
  var S = {};

  function blank() {
    return {
      v: 1,
      settings: { name: '', theme: 'auto', hide: false, demo: false },
      accounts: [], cards: [], tx: [], budgets: {}, customCats: []
    };
  }

  function normalize(st) {
    var b = blank();
    st = st && typeof st === 'object' ? st : b;
    st.settings = Object.assign(b.settings, st.settings || {});
    ['accounts', 'cards', 'tx', 'customCats'].forEach(function (k) { if (!Array.isArray(st[k])) st[k] = []; });
    if (!st.budgets || typeof st.budgets !== 'object') st.budgets = {};
    st.v = 1;
    return st;
  }

  function persist() {
    var s = JSON.stringify(state);
    try { localStorage.setItem(KEY, s); } catch (e) { mem = s; }
  }
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(persist, 120);
  }
  S.flush = function () { if (timer) { clearTimeout(timer); timer = null; persist(); } };

  function applyDerived() {
    Cat.setCustom(state.customCats);
    U.hidden = !!state.settings.hide;
  }

  S.get = function () { return state; };
  S.subscribe = function (fn) { subs.push(fn); };
  function emit() { subs.forEach(function (fn) { fn(); }); }

  /** Aplica uma mutação, salva e notifica as telas. */
  S.commit = function (fn) {
    fn(state);
    applyDerived();
    schedule();
    emit();
  };

  S.init = function () {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = mem; }
    if (!raw) raw = mem;
    var parsed = null;
    try { parsed = raw ? JSON.parse(raw) : null; } catch (e) { parsed = null; }
    if (parsed) { state = normalize(parsed); applyDerived(); }
    else { S.seedDemo(); }
  };

  /* ---------- consultas ---------- */
  S.account = function (id) { return state.accounts.find(function (a) { return a.id === id; }); };
  S.card = function (id) { return state.cards.find(function (c) { return c.id === id; }); };
  S.tx = function (id) { return state.tx.find(function (t) { return t.id === id; }); };

  /** Saldo atual de cada conta (só lançamentos efetivados). */
  S.balances = function () {
    var m = {};
    state.accounts.forEach(function (a) { m[a.id] = a.init || 0; });
    state.tx.forEach(function (t) {
      if (!t.paid || !t.acc || m[t.acc] === undefined) return;
      if (t.type === 'income') m[t.acc] += t.amount;
      else if (t.type === 'expense') m[t.acc] -= t.amount;
      else if (t.type === 'transfer') { m[t.acc] -= t.amount; if (t.to && m[t.to] !== undefined) m[t.to] += t.amount; }
    });
    return m;
  };
  S.totalBalance = function (bal) {
    bal = bal || S.balances();
    return U.sum(state.accounts, function (a) { return a.nosum ? 0 : bal[a.id]; });
  };

  S.monthTx = function (ym) {
    return state.tx.filter(function (t) { return t.date.slice(0, 7) === ym; });
  };
  function counts(t) { return t.type !== 'transfer' && t.kind !== 'invoice'; }

  /** Ganhos e gastos do mês (transferências e pagamento de fatura ficam de fora). */
  S.totals = function (ym) {
    var r = { inc: 0, exp: 0, pendInc: 0, pendExp: 0 };
    S.monthTx(ym).forEach(function (t) {
      if (!counts(t)) return;
      if (t.type === 'income') { r.inc += t.amount; if (!t.paid) r.pendInc += t.amount; }
      else { r.exp += t.amount; if (!t.paid) r.pendExp += t.amount; }
    });
    return r;
  };

  /** Gasto por grupo/categoria no mês. type: 'expense' | 'income'. */
  S.byGroup = function (ym, type) {
    var out = {};
    S.monthTx(ym).forEach(function (t) {
      if (!counts(t) || t.type !== type) return;
      var c = Cat.get(t.cat), g = out[c.g] || (out[c.g] = { total: 0, cats: {} });
      g.total += t.amount;
      g.cats[c.id] = (g.cats[c.id] || 0) + t.amount;
    });
    return out;
  };

  S.series = function (ym, n) {
    var out = [];
    for (var i = n - 1; i >= 0; i--) {
      var m = U.addMonths(ym, -i), t = S.totals(m);
      out.push({ ym: m, inc: t.inc, exp: t.exp });
    }
    return out;
  };

  /* ---------- faturas de cartão ---------- */
  S.invKey = function (card, date) {
    var ym = date.slice(0, 7);
    return +date.slice(8, 10) > card.closing ? U.addMonths(ym, 1) : ym;
  };
  S.invDates = function (card, ym) {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7);
    var close = ym + '-' + U.pad(Math.min(card.closing, U.dim(y, m)));
    var dueYm = card.due > card.closing ? ym : U.addMonths(ym, 1);
    var dy = +dueYm.slice(0, 4), dm = +dueYm.slice(5, 7);
    return { close: close, due: dueYm + '-' + U.pad(Math.min(card.due, U.dim(dy, dm))) };
  };
  S.invPayment = function (cardId, ym) {
    return state.tx.find(function (t) { return t.inv && t.inv.card === cardId && t.inv.ym === ym; });
  };
  S.invoice = function (cardId, ym) {
    var card = S.card(cardId);
    var items = state.tx.filter(function (t) { return t.card === cardId && S.invKey(card, t.date) === ym; })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var total = U.sum(items, function (t) { return t.type === 'income' ? -t.amount : t.amount; });
    var d = S.invDates(card, ym), pay = S.invPayment(cardId, ym), today = U.today(), status;
    if (pay) status = 'paid';
    else if (today > d.due) status = 'overdue';
    else if (today > d.close) status = 'closed';
    else status = 'open';
    return { card: card, ym: ym, items: items, total: total, close: d.close, due: d.due, pay: pay, status: status };
  };
  /** Faturas ainda não pagas (com valor), de todos os cartões. */
  S.openInvoices = function () {
    var out = [];
    state.cards.forEach(function (card) {
      var keys = {};
      state.tx.forEach(function (t) { if (t.card === card.id) keys[S.invKey(card, t.date)] = 1; });
      Object.keys(keys).sort().forEach(function (ym) {
        var inv = S.invoice(card.id, ym);
        if (inv.status !== 'paid' && inv.total > 0) out.push(inv);
      });
    });
    return out;
  };
  S.cardUsed = function (cardId) {
    return U.sum(S.openInvoices().filter(function (i) { return i.card.id === cardId; }), function (i) { return i.total; });
  };
  /** Fatura "atual" do cartão: a primeira ainda não paga, ou a do mês corrente. */
  S.currentInvoiceYm = function (cardId) {
    var card = S.card(cardId), open = S.openInvoices().filter(function (i) { return i.card.id === cardId; });
    if (open.length) return open[0].ym;
    return S.invKey(card, U.today());
  };

  /** Próximos lançamentos: pendentes (inclui atrasados) e faturas a vencer nos próximos 30 dias. */
  S.upcoming = function () {
    var today = U.today(), limit = U.addDays(today, 30), out = [];
    state.tx.forEach(function (t) {
      if (t.paid || t.card || t.type === 'transfer' || t.date > limit) return;
      out.push({ kind: 'tx', date: t.date, tx: t });
    });
    S.openInvoices().forEach(function (i) {
      if (i.due <= limit) out.push({ kind: 'inv', date: i.due, inv: i });
    });
    return out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  };

  /** Saldo previsto até o fim do mês informado. */
  S.projected = function (ym) {
    var end = ym + '-31', bal = S.totalBalance();
    state.tx.forEach(function (t) {
      if (t.paid || t.card || !t.acc || t.date > end || t.type === 'transfer') return;
      var a = S.account(t.acc);
      if (!a || a.nosum) return;
      bal += t.type === 'income' ? t.amount : -t.amount;
    });
    S.openInvoices().forEach(function (i) { if (i.due <= end) bal -= i.total; });
    return bal;
  };

  /* ---------- lançamentos ---------- */
  function mkTx(o) {
    return Object.assign({
      id: U.uid(), type: 'expense', amount: 0, desc: '', cat: 'sem-categoria', acc: null, card: null,
      to: null, date: U.today(), paid: true, note: ''
    }, o);
  }

  /** Cria um lançamento; rep = {mode:'none'|'fixed'|'inst', count}. */
  S.addTx = function (base, rep) {
    var today = U.today(), list = [];
    rep = rep || { mode: 'none', count: 1 };
    var n = rep.mode === 'none' ? 1 : U.clamp(rep.count || 2, 2, 120);
    var sid = rep.mode === 'none' ? null : 's' + U.uid();
    var each = base.amount, rest = 0;
    if (rep.mode === 'inst') { each = Math.floor(base.amount / n); rest = base.amount - each * n; }
    for (var i = 0; i < n; i++) {
      var date = U.addMonths(base.date, i);
      var t = mkTx(base);
      t.date = date;
      t.amount = each + (i === 0 ? rest : 0);
      if (base.card) t.paid = true;
      else t.paid = i === 0 ? !!base.paid : (!!base.paid && date <= today);
      if (sid) { t.s = sid; t.n = i + 1; t.N = n; t.rec = rep.mode; }
      list.push(t);
    }
    S.commit(function (st) { st.tx.push.apply(st.tx, list); });
    return list;
  };

  function series(st, t, scope) {
    if (!t.s || scope === 'this' || !scope) return [t];
    return st.tx.filter(function (x) { return x.s === t.s && (scope === 'all' || x.n >= t.n); });
  }
  S.seriesCount = function (t, scope) {
    return series(state, t, scope).length;
  };

  S.updateTx = function (id, patch, scope) {
    S.commit(function (st) {
      var t = st.tx.find(function (x) { return x.id === id; });
      if (!t) return;
      series(st, t, scope).forEach(function (x) {
        if (x === t) { Object.assign(x, patch); return; }
        ['desc', 'cat', 'acc', 'card', 'to', 'type', 'note'].forEach(function (k) { if (k in patch) x[k] = patch[k]; });
        if ('amount' in patch && x.rec === 'fixed') x.amount = patch.amount;
        if (x.card) x.paid = true;
      });
    });
  };

  S.removeTx = function (id, scope) {
    S.commit(function (st) {
      var t = st.tx.find(function (x) { return x.id === id; });
      if (!t) return;
      var ids = {};
      series(st, t, scope).forEach(function (x) { ids[x.id] = 1; });
      st.tx = st.tx.filter(function (x) { return !ids[x.id]; });
    });
  };

  S.togglePaid = function (id) {
    S.commit(function (st) {
      var t = st.tx.find(function (x) { return x.id === id; });
      if (t && !t.card) t.paid = !t.paid;
    });
  };

  S.snapshot = function () { return JSON.stringify(state); };
  S.restore = function (snap) {
    S.commit(function (st) {
      var p = normalize(JSON.parse(snap));
      Object.keys(st).forEach(function (k) { delete st[k]; });
      Object.assign(st, p);
    });
  };

  S.payInvoice = function (cardId, ym, accId, date) {
    var inv = S.invoice(cardId, ym);
    if (inv.pay || inv.total <= 0) return;
    S.commit(function (st) {
      st.tx.push(mkTx({
        type: 'expense', kind: 'invoice', amount: inv.total, desc: 'Fatura ' + inv.card.name,
        cat: 'fatura', acc: accId, date: date, paid: true, inv: { card: cardId, ym: ym }
      }));
    });
  };

  /* ---------- contas e cartões ---------- */
  S.saveAccount = function (data) {
    var id = data.id;
    S.commit(function (st) {
      if (id) {
        var a = st.accounts.find(function (x) { return x.id === id; });
        if (!a) return;
        // o campo de saldo mostra o saldo atual; ajusta o saldo inicial pela diferença
        var cur = S.balances()[id];
        a.init = (a.init || 0) + (data.balance - cur);
        a.name = data.name; a.type = data.type; a.color = data.color; a.nosum = !!data.nosum;
      } else {
        st.accounts.push({ id: U.uid(), name: data.name, type: data.type, color: data.color, init: data.balance, nosum: !!data.nosum });
      }
    });
  };
  S.deleteAccount = function (id) {
    S.commit(function (st) {
      st.accounts = st.accounts.filter(function (a) { return a.id !== id; });
      st.tx = st.tx.filter(function (t) { return t.acc !== id && t.to !== id; });
      st.cards.forEach(function (c) { if (c.payAcc === id) c.payAcc = null; });
    });
  };
  S.saveCard = function (data) {
    S.commit(function (st) {
      if (data.id) {
        var c = st.cards.find(function (x) { return x.id === data.id; });
        if (c) Object.assign(c, data);
      } else {
        st.cards.push({ id: U.uid(), name: data.name, color: data.color, limit: data.limit, closing: data.closing, due: data.due, payAcc: data.payAcc });

  };
  S.deleteCard = function (id) {
    S.commit(function (st) {
      st.cards = st.cards.filter(function (c) { return c.id !== id; });
      st.tx = st.tx.filter(function (t) { return t.card !== id && !(t.inv && t.inv.card === id); });
    });
  };

  /* ---------- orçamento, categorias, ajustes ---------- */
  S.setBudget = function (gid, cents) {
    S.commit(function (st) { if (cents > 0) st.budgets[gid] = cents; else delete st.budgets[gid]; });
  };
  S.saveCat = function (data) {
    S.commit(function (st) {
      if (data.id) {

        st.customCats.push({ id: 'c' + U.uid(), g: data.g, name: data.name, icon: data.icon });

  };
  S.deleteCat = function (id) {
    S.commit(function (st) {
      st.customCats = st.customCats.filter(function (c) { return c.id !== id; });

  };
  S.setSetting = function (k, v) { S.commit(function (st) { st.settings[k] = v; }); };

  S.exportJSON = function () { return JSON.stringify(state, null, 1); };

  S.reset = function () {
    S.commit(function (st) {
      var n = blank();
      n.settings.theme = st.settings.theme;
      Object.keys(st).forEach(function (k) { delete st[k]; });

    });
  };

  /* ---------- dados de exemplo ---------- */
  S.seedDemo = function () {
    var n = blank(), today = U.today(), thisYm = today.slice(0, 7);
    state = n;
    n.settings.demo = true;
    var r = U.rng(20261025);
    function rnd(a, b) { return Math.round((a + r() * (b - a)) * 100); }
    function pick(a) { return a[Math.floor(r() * a.length)]; }

    n.accounts = [
      { id: 'a1', name: 'Nuconta', type: 'checking', color: '#8a05be', init: 80000 },
      { id: 'a2', name: 'Itaú', type: 'checking', color: '#ff6200', init: 380000 },
      { id: 'a3', name: 'Caixa Poupança', type: 'savings', color: '#0b6fb5', init: 125000 },
      { id: 'a4', name: 'Carteira', type: 'cash', color: '#7a8a82', init: 65000 }
    ];
    n.cards = [
      { id: 'c1', name: 'Nubank', color: '#8a05be', limit: 600000, closing: 20, due: 27, payAcc: 'a1' },
      { id: 'c2', name: 'Inter', color: '#ff7a00', limit: 250000, closing: 5, due: 12, payAcc: 'a1' }
    ];
    n.budgets = { alimentacao: 140000, transporte: 45000, lazer: 40000, compras: 50000, digitais: 12000, saude: 35000, moradia: 210000 };

    var months = [];
    for (var i = -5; i <= 1; i++) months.push(U.addMonths(thisYm, i));
    var total = months.length;

    function add(o) {
      var t = mkTx(o);
      if (t.card) t.paid = true; else if (o.paid === undefined) t.paid = t.date <= today;
      n.tx.push(t);
      return t;
    }
    function day(ym, d) { return ym + '-' + U.pad(Math.min(d, U.dim(+ym.slice(0, 4), +ym.slice(5, 7)))); }
    function fixed(ym, idx, key, d, o) {
      o.date = day(ym, d); o.s = 'demo-' + key; o.n = idx + 1; o.N = total; o.rec = 'fixed';
      return add(o);
    }

    months.forEach(function (ym, idx) {
      var future = ym > thisYm;
      fixed(ym, idx, 'salario', 5, { type: 'income', amount: 580000, desc: 'Salário', cat: 'salario', acc: 'a1' });
      fixed(ym, idx, 'aluguel', 8, { amount: 145000, desc: 'Aluguel', cat: 'aluguel', acc: 'a1' });
      fixed(ym, idx, 'internet', 10, { amount: 11990, desc: 'Internet fibra', cat: 'internet', acc: 'a1' });
      fixed(ym, idx, 'academia', 3, { amount: 9990, desc: 'Academia SmartFit', cat: 'academia', card: 'c1' });
      fixed(ym, idx, 'netflix', 9, { amount: 5590, desc: 'Netflix', cat: 'streaming-video', card: 'c1' });
      fixed(ym, idx, 'spotify', 11, { amount: 2190, desc: 'Spotify', cat: 'streaming-musica', card: 'c1' });
      fixed(ym, idx, 'celular', 15, { amount: 4990, desc: 'Plano celular', cat: 'celular', card: 'c1' });
      fixed(ym, idx, 'invest', 6, { amount: 50000, desc: 'Aporte mensal', cat: 'investimento-auto', acc: 'a1' });
      fixed(ym, idx, 'poupanca', 7, { type: 'transfer', amount: 30000, desc: 'Reserva de emergência', cat: 'transferencias', acc: 'a1', to: 'a3' });
      add({ type: 'expense', amount: rnd(150, 235), desc: 'Conta de luz', cat: 'eletricidade', acc: 'a1', date: day(ym, 12) });
      add({ type: 'expense', amount: rnd(52, 92), desc: 'Conta de água', cat: 'agua', acc: 'a1', date: day(ym, 14) });
      if (future) return;
      if (idx % 2 === 1) add({ type: 'income', amount: rnd(450, 1300), desc: 'Projeto freelance', cat: 'freelance', acc: 'a1', date: day(ym, 16) });

      var last = ym === thisYm ? +today.slice(8, 10) : 28;
      function when() { return day(ym, 1 + Math.floor(r() * last)); }

      for (i2 = 0; i2 < 3; i2++) add({ type: 'expense', amount: rnd(32, 82), desc: pick(['iFood', 'Rappi', 'Delivery Japa']), cat: 'delivery', card: 'c2', date: when() });
      for (i2 = 0; i2 < 5; i2++) add({ type: 'expense', amount: rnd(11, 46), desc: pick(['Uber', '99 Táxi', 'Uber']), cat: 'taxi', card: 'c1', date: when() });
      for (i2 = 0; i2 < 2; i2++) add({ type: 'expense', amount: rnd(120, 220), desc: 'Posto Ipiranga', cat: 'gasolina', acc: 'a2', date: when() });
      add({ type: 'expense', amount: rnd(24, 120), desc: 'Drogasil', cat: 'farmacia', acc: 'a4', date: when() });
      add({ type: 'expense', amount: rnd(60, 220), desc: pick(['Cinema Cinemark', 'Ingresso show', 'Boliche']), cat: 'cinema', card: 'c2', date: when() });

<script>
/* Camada de interface: ações por data-a, bottom sheets, diálogos, toasts, histórico (botão voltar). */
(function (G) {
  'use strict';
  var UI = { actions: {}, nav: null };
  var stack = [];
  var skip = 0, queue = [], skipTimer = null;
  var standalone = (function () { try { return G.top === G; } catch (e) { return false; } })();

  /* ---------- ações ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el) return;
    var fn = UI.actions[el.getAttribute('data-a')];
    if (fn) { if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault(); fn(el, e); }
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.hasAttribute && el.hasAttribute('data-money')) UI.formatMoney(el);
    var s = stack[stack.length - 1];
    if (s && s.onInput && s.el.contains(el)) s.onInput(el, e);
    else if (UI.onViewInput && !s) UI.onViewInput(el, e);
  });
  document.addEventListener('change', function (e) {
    var el = e.target, s = stack[stack.length - 1];
    if (s && s.onChange && s.el.contains(el)) s.onChange(el, e);
    else if (UI.onViewChange && !s) UI.onViewChange(el, e);
  });
  /** Campos de dinheiro mantêm o cursor sempre no fim. */
  function caretEnd(e) {
    var el = e.target;
    if (!el.hasAttribute || !el.hasAttribute('data-money')) return;
    var go = function () { try { el.setSelectionRange(el.value.length, el.value.length); } catch (err) { /* ignora */ } };
    go(); setTimeout(go, 0);
  }
  document.addEventListener('focusin', caretEnd);
  document.addEventListener('beforeinput', function (e) {
    var el = e.target;
    if (el.hasAttribute && el.hasAttribute('data-money')) { try { el.setSelectionRange(el.value.length, el.value.length); } catch (err) { /* ignora */ } }
  });
  document.addEventListener('click', caretEnd);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && stack.length) UI.close();
  });

  /** Campo de dinheiro: os dígitos preenchem da direita para a esquerda. */
  UI.formatMoney = function (el) {
    var d = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 11);
    el.dataset.cents = d || '0';
    el.value = U.num(parseInt(d || '0', 10));
    try { el.setSelectionRange(el.value.length, el.value.length); } catch (err) { /* ignora */ }
  };
  UI.cents = function (el) { return el ? parseInt(el.dataset.cents || el.value.replace(/\D/g, '') || '0', 10) : 0; };
  UI.moneyAttrs = function (cents) { return 'data-money inputmode="numeric" autocomplete="off" data-cents="' + (cents || 0) + '" value="' + U.num(cents || 0) + '"'; };

  /* ---------- histórico ---------- */
  function histState() { return { r: UI.nav ? UI.nav.route() : '', sh: stack.length }; }
  function pushHist() { if (!standalone) return false; try { history.pushState(histState(), ''); return true; } catch (e) { return false; } }
  function histBack() {
    skip++;
    clearTimeout(skipTimer);
    skipTimer = setTimeout(flushQueue, 250);
    try { history.back(); } catch (e) { skip = 0; }
  }
  function flushQueue() {
    skip = 0;
    var q = queue; queue = [];
    q.forEach(function (fn) { fn(); });
  }
  /** Executa fn depois que o histórico terminar de voltar. */
  UI.afterHistory = function (fn) { if (skip > 0) queue.push(fn); else fn(); };

  G.addEventListener('popstate', function (e) {
    if (skip > 0) { skip--; if (skip === 0) { clearTimeout(skipTimer); flushQueue(); } return; }
    var st = e.state || {};
    var want = typeof st.sh === 'number' ? st.sh : 0;
    while (stack.length > want) UI.close(stack[stack.length - 1], true);
    if (UI.nav && st.r && st.r !== UI.nav.route()) UI.nav.restore(st.r);
  });

  /* ---------- sheets ---------- */
  UI.sheet = function (opts) {
    var wrap = document.createElement('div');
    wrap.className = 'sheet ' + (opts.cls || '');
    wrap.innerHTML = '<div class="backdrop" data-a="sheet-close"></div>' +
      '<div class="panel" role="dialog" aria-modal="true"' + (opts.label ? ' aria-label="' + U.esc(opts.label) + '"' : '') + '>' + opts.html + '</div>';
    document.getElementById('sheets').appendChild(wrap);
    var s = { el: wrap, panel: wrap.querySelector('.panel'), closed: false, onClose: opts.onClose, onInput: null, onChange: null, hist: false };
    stack.push(s);
    s.hist = pushHist();
    document.body.classList.add('noscroll');
    requestAnimationFrame(function () { requestAnimationFrame(function () { wrap.classList.add('open'); }); });
    if (opts.onMount) opts.onMount(s);
    return s;
  };
  UI.setHtml = function (s, html) { s.panel.innerHTML = html; };
  UI.top = function () { return stack[stack.length - 1]; };
  UI.hasSheet = function () { return stack.length > 0; };

  UI.close = function (s, fromPop) {
    s = s && s.panel ? s : stack[stack.length - 1];
    if (!s || s.closed) return;
    s.closed = true;
    stack.splice(stack.indexOf(s), 1);
    s.el.classList.remove('open');
    setTimeout(function () { if (s.el.parentNode) s.el.parentNode.removeChild(s.el); }, 280);
    if (!stack.length) document.body.classList.remove('noscroll');
    if (s.hist && !fromPop) histBack();
    if (s.onClose) s.onClose();
  };
  UI.closeAll = function () { while (stack.length) UI.close(stack[stack.length - 1]); };
  UI.actions['sheet-close'] = function (el) {
    var sh = el.closest('.sheet'), s = stack.filter(function (x) { return x.el === sh; })[0];
    UI.close(s);
  };

  /* ---------- diálogos ---------- */
  /** Diálogo com várias opções. opts: {title, text, options:[{label, val, kind}]} */
  UI.choice = function (opts, cb) {
    var html = '<div class="dlg"><h3>' + U.esc(opts.title) + '</h3>' +
      (opts.text ? '<p>' + U.esc(opts.text) + '</p>' : '') + '<div class="dlg-btns">' +
      opts.options.map(function (o, i) {
        return '<button class="btn ' + (o.kind || 'ghost') + '" data-a="dlg-pick" data-i="' + i + '">' + U.esc(o.label) + '</button>';
      }).join('') +
      '<button class="btn plain" data-a="sheet-close">Cancelar</button></div></div>';
    var s = UI.sheet({ cls: 'center', html: html, label: opts.title });
    s.pick = function (i) { UI.close(s); UI.afterHistory(function () { cb(opts.options[i].val); }); };
  };
  UI.actions['dlg-pick'] = function (el) {
    var sh = el.closest('.sheet'), s = null;
    for (var i = 0; i < stack.length; i++) if (stack[i].el === sh) s = stack[i];
    if (s && s.pick) s.pick(+el.dataset.i);
  };
  UI.confirm = function (opts, cb) {
    UI.choice({ title: opts.title, text: opts.text, options: [{ label: opts.ok || 'Confirmar', val: true, kind: opts.danger ? 'danger' : 'primary' }] }, cb);
  };

  /* ---------- toast ---------- */
  var toastTimer = null;
  UI.toast = function (msg, action) {
    var t = document.getElementById('toast');
    t.innerHTML = '<span>' + U.esc(msg) + '</span>' + (action ? '<button data-a="toast-act">' + U.esc(action.label) + '</button>' : '');
    t._fn = action && action.fn;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, action ? 6000 : 2600);
  };
  UI.actions['toast-act'] = function () {
    var t = document.getElementById('toast');
    t.classList.remove('show');
    if (t._fn) t._fn();
  };

  G.UI = UI;
})(window);

</script>
<script>
/* Telas do app: início, extrato, planejar (orçamento/relatórios), contas, fatura, menu e categorias. */
(function (G) {
  'use strict';
  var esc = U.esc, M = function (c) { return U.money(c); };

  var V = {
    ym: U.today().slice(0, 7),
    ext: { q: '', type: 'all', acc: '', sort: 'desc' },
    rep: 'expense',
    plan: 'orc',
    catQ: ''
  };
  G.V = V;

  var TABS = { home: 1, extrato: 1, orcamento: 1, contas: 1 };

  /* ---------- peças reutilizáveis ---------- */
  function catBadge(catId, size, status) {
    var c = Cat.get(catId), g = Cat.group(c.g);
    return '<span class="ci" style="--c:' + g.color + '">' + icon(c.icon, size || 20) + (status || '') + '</span>';
  }
  function groupBadge(g, size) { return '<span class="ci" style="--c:' + g.color + '">' + icon(g.icon, size || 20) + '</span>'; }
  function avatar(a, cls) {
    return '<span class="av ' + (cls || '') + '" style="background:' + a.color + ';color:' + fgOn(a.color) + '">' + esc(U.initials(a.name)) + '</span>';
  }
  function stBadge(t) {
    if (t.type === 'transfer') return '';
    return t.paid ? '<i class="st ok">' + icon('check', 10) + '</i>' : '<i class="st pend' + (t.date < U.today() ? ' late' : '') + '">' + icon('clock', 10) + '</i>';
  }

  function txParts(t) {
    var c = Cat.get(t.cat), where = '', title = t.desc || c.name, ic, color = null;
    if (t.card) { var cd = S.card(t.card); where = (cd ? cd.name : 'Cartão') + ' · Crédito'; }
    else if (t.type === 'transfer') {
      var a = S.account(t.acc), b = S.account(t.to);
      where = (a ? a.name : '?') + ' → ' + (b ? b.name : '?');
    } else { var ac = S.account(t.acc); where = ac ? ac.name : ''; }
    if (t.type === 'transfer' && !t.desc) title = 'Transferência';
    if (t.rec === 'inst') title += ' (' + t.n + '/' + t.N + ')';
    if (t.type === 'transfer') { ic = '<span class="ci" style="--c:#3b6cf0">' + icon('swap', 20) + '</span>'; }
    else if (t.kind === 'invoice') {
      var cc = S.card(t.inv.card);
      ic = '<span class="ci" style="--c:' + (cc ? cc.color : '#45b866') + '">' + icon('card', 20) + stBadge(t) + '</span>';
    } else ic = catBadge(t.cat, 20, stBadge(t));
    return { title: title, sub: (t.type === 'transfer' ? 'Transferência' : c.name) + ' | ' + where, icon: ic, color: color };
  }

  function amountHtml(t) {
    var cls = t.type === 'income' ? 'pos' : t.type === 'transfer' ? 'info' : 'neg';
    var sign = t.type === 'income' ? '+' : t.type === 'transfer' ? '' : '−';
    return '<b class="amt ' + cls + (t.paid ? '' : ' pend') + '">' + sign + M(t.amount) + '</b>';
  }

  function txRow(t, withDate) {
    var p = txParts(t);
    return '<button class="row" data-a="tx" data-id="' + t.id + '">' + p.icon +
      '<span class="rm"><b class="rt">' + esc(p.title) + (t.rec === 'fixed' ? ' <span class="rep" title="Recorrente">' + icon('repeat', 12) + '</span>' : '') + '</b>' +
      '<small class="rs">' + esc(p.sub) + '</small></span>' +
      '<span class="ra">' + amountHtml(t) + (withDate ? '<small>' + U.dayShort(t.date) + '</small>' : '') + '</span></button>';
  }

  function groupByDay(list, desc) {
    var days = {}, order = [];
    list.forEach(function (t) { if (!days[t.date]) { days[t.date] = []; order.push(t.date); } days[t.date].push(t); });
    order.sort(); if (desc) order.reverse();
    return order.map(function (d) {
      var net = U.sum(days[d], function (t) { return t.type === 'income' ? t.amount : t.type === 'expense' && t.kind !== 'invoice' ? -t.amount : 0; });
      return '<div class="day"><span>' + esc(U.dayLabel(d)) + '</span>' + (net ? '<small class="' + (net > 0 ? 'pos' : 'neg') + '">' + (net > 0 ? '+' : '−') + M(Math.abs(net)) + '</small>' : '') + '</div>' +
        '<div class="list">' + days[d].map(function (t) { return txRow(t); }).join('') + '</div>';
    }).join('');
  }

  function monthTabs() {
    var yr = new Date().getFullYear();
    function lab(ym, cur) {
      var s = cur ? U.monthName(ym) : U.monthShort(ym);
      if (+ym.slice(0, 4) !== yr) s += cur ? ' ' + ym.slice(0, 4) : ' ’' + ym.slice(2, 4);
      return s;
    }
    return '<nav class="mt" aria-label="Mês">' +
      '<button data-a="month" data-d="-1">' + lab(U.addMonths(V.ym, -1)) + '</button>' +
      '<button class="on" data-a="month-pick" aria-label="Escolher mês">' + lab(V.ym, true) + '</button>' +
      '<button data-a="month" data-d="1">' + lab(U.addMonths(V.ym, 1)) + '</button></nav>';
  }

  function eyeBtn() {
    return '<button class="ibtn" data-a="toggle-hide" aria-label="' + (U.hidden ? 'Mostrar valores' : 'Ocultar valores') + '">' + icon(U.hidden ? 'eyeoff' : 'eye', 20) + '</button>';
  }

  function subHeader(title, right) {
    return '<header class="hdr sub"><div class="hdr-row"><button class="ibtn" data-a="back" aria-label="Voltar">' + icon('left', 22) + '</button>' +
      '<h1>' + esc(title) + '</h1><div class="hdr-actions">' + (right || '') + '</div></div></header>';
  }

  function empty(ic, title, text, btn) {
    return '<div class="empty">' + icon(ic, 34) + '<b>' + esc(title) + '</b><p>' + esc(text) + '</p>' + (btn || '') + '</div>';
  }

  function greeting() {
    var h = new Date().getHours();
    return h < 5 ? 'Boa madrugada' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  }

  /* ---------- início ---------- */
  function home() {
    var st = S.get(), ym = V.ym, bal = S.balances(), total = S.totalBalance(bal), t = S.totals(ym);
    var name = st.settings.name.trim(), now = U.today().slice(0, 7);
    var h = '<header class="hdr home"><div class="hdr-row">' +
      '<button class="who" data-a="go" data-r="menu"><span class="me">' + (name ? esc(name[0].toUpperCase()) : icon('user', 18)) + '</span>' +
      '<span><small>' + greeting() + (name ? ',' : '') + '</small>' + (name ? '<b>' + esc(name.split(' ')[0]) + '</b>' : '<b>Meu Bolso</b>') + '</span></button>' +
      '<div class="hdr-actions">' + eyeBtn() + '<button class="ibtn" data-a="month-pick" aria-label="Escolher mês">' + icon('calendar', 20) + '</button></div></div>' +
      monthTabs() +
      '<div class="bal"><div><small>Saldo geral</small><strong>' + M(total) + '</strong>' +
      (ym >= now ? '<small class="proj">Previsto até o fim de ' + U.monthName(ym).toLowerCase() + ': <b>' + M(S.projected(ym)) + '</b></small>' : '<small class="proj">Saldo atual de todas as contas</small>') +
      '</div><button class="more" data-a="go" data-r="contas">Detalhes ' + icon('right', 16) + '</button></div></header>';

    var b = '<main class="page pull">';
    b += '<div class="stats"><button class="stat" data-a="ext-filter" data-t="income"><span class="si pos">' + icon('trendingup', 18) + '</span><span><small>Ganhos</small><b>' + M(t.inc) + '</b></span></button>' +
      '<button class="stat" data-a="ext-filter" data-t="expense"><span class="si neg">' + icon('trendingup', 18, 'flipy') + '</span><span><small>Gastos</small><b>' + M(t.exp) + '</b></span></button></div>';

    if (st.settings.demo) {
      b += '<div class="note"><div>' + icon('sparkles', 20) + '<p><b>Dados de exemplo.</b> Explore à vontade e depois comece com os seus.</p></div>' +
        '<div class="note-btns"><button class="btn mini ghost" data-a="demo-keep">Entendi</button><button class="btn mini primary" data-a="reset">Começar do zero</button></div></div>';
    }

    if (!st.accounts.length) {
      b += '<div class="card welcome"><h2>Vamos começar</h2><p>Crie sua primeira conta para registrar ganhos e gastos.</p>' +
        '<button class="btn primary" data-a="account-new">' + icon('plus', 18) + ' Criar conta</button></div>';
      return h + b + '</main>';
    }

    // alertas de orçamento
    var by = S.byGroup(ym, 'expense'), alerts = [];
    Object.keys(st.budgets).forEach(function (gid) {
      var spent = by[gid] ? by[gid].total : 0, pct = spent / st.budgets[gid];
      if (pct >= 0.8) alerts.push({ g: Cat.group(gid), pct: pct, spent: spent, limit: st.budgets[gid] });
    });
    alerts.sort(function (a, c) { return c.pct - a.pct; });
    if (alerts.length) {
      b += '<div class="alerts">' + alerts.slice(0, 2).map(function (a) {
        return '<button class="alert ' + (a.pct >= 1 ? 'over' : 'warn') + '" data-a="go" data-r="orcamento">' + icon('alert', 18) +
          '<span><b>' + esc(a.g.name) + '</b> ' + (a.pct >= 1 ? 'passou do limite em ' + M(a.spent - a.limit) : 'já usou ' + Math.round(a.pct * 100) + '% do orçamento') + '</span>' + icon('right', 16) + '</button>';
      }).join('') + '</div>';
    }

    // próximos lançamentos
    var up = S.upcoming();
    b += '<div class="sec"><h2>Próximos lançamentos</h2><button class="lnk" data-a="ext-filter" data-t="pending">Ver todos</button></div>';
    if (!up.length) b += '<div class="card soft slim">' + icon('circlecheck', 20) + '<span>Nada pendente para os próximos 30 dias.</span></div>';
    else {
      b += '<div class="hscroll">' + up.slice(0, 12).map(function (u) {
        var late = u.date < U.today();
        if (u.kind === 'inv') {
          var i = u.inv;
          return '<button class="up" data-a="go" data-r="fatura/' + i.card.id + '/' + i.ym + '"><span class="up-top"><span class="ci" style="--c:' + i.card.color + '">' + icon('card', 18) + '</span><span class="up-t"><b>Fatura ' + esc(i.card.name) + '</b><small>Cartão de crédito</small></span></span>' +
            '<span class="up-b"><small class="' + (late ? 'late' : '') + '">' + (late ? 'Venceu ' : 'Vence ') + U.dayShort(u.date) + '</small><b>' + M(i.total) + '</b></span></button>';
        }
        var x = u.tx, p = txParts(x), c = Cat.get(x.cat);
        return '<button class="up" data-a="tx" data-id="' + x.id + '"><span class="up-top">' + catBadge(x.cat, 18) + '<span class="up-t"><b>' + esc(p.title) + '</b><small>' + esc(Cat.group(c.g).name) + (x.rec === 'fixed' ? ' | Recorrência' : '') + '</small></span></span>' +
          '<span class="up-b"><small class="' + (late ? 'late' : '') + '">' + (late ? 'Atrasado ' : '') + U.dayShort(x.date) + '</small><b class="' + (x.type === 'income' ? 'pos' : '') + '">' + M(x.amount) + '</b></span></button>';
      }).join('') + '</div>';
    }

    // últimas transações
    var today = U.today();
    var last = st.tx.filter(function (x) { return x.date <= today; })
      .sort(function (a, c) { return a.date < c.date ? 1 : a.date > c.date ? -1 : (a.id < c.id ? 1 : -1); }).slice(0, 6);
    b += '<div class="sec"><h2>Últimas transações</h2><button class="lnk" data-a="go" data-r="extrato">Ver extrato</button></div>';
    b += last.length ? '<div class="list card flush">' + last.map(function (x) { return txRow(x, true); }).join('') + '</div>' :
      empty('receipt', 'Nenhum lançamento ainda', 'Toque no botão + para registrar o primeiro.');

    b += '<div class="quick"><button data-a="go" data-r="orcamento" data-p="rep">' + icon('pie', 20) + '<span>Relatórios</span></button>' +
      '<button data-a="go" data-r="orcamento" data-p="orc">' + icon('target', 20) + '<span>Orçamento</span></button>' +
      '<button data-a="go" data-r="categorias">' + icon('tag', 20) + '<span>Categorias</span></button></div>';
    return h + b + '</main>';
  }

  /* ---------- extrato ---------- */
  function extFiltered() {
    var f = V.ext, q = U.norm(f.q);
    var list = S.monthTx(V.ym).filter(function (t) {
      if (f.type === 'income' && t.type !== 'income') return false;
      if (f.type === 'expense' && (t.type !== 'expense')) return false;
      if (f.type === 'pending' && (t.paid || t.card)) return false;
      if (f.type === 'transfer' && t.type !== 'transfer') return false;
      if (f.acc) {
        if (f.acc.indexOf('c:') === 0) { if (t.card !== f.acc.slice(2)) return false; }
        else if (t.acc !== f.acc && t.to !== f.acc) return false;

        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    return list;
  }

      '<button class="sq" data-a="ext-sort" aria-label="Inverter ordem">' + icon('swap', 18, 'rot90') + '</button></div>' +

  /* ---------- planejar: orçamento e relatórios ---------- */
  function seg(items, cur, action) {
    return '<div class="seg">' + items.map(function (i) {
      return '<button class="' + (cur === i[0] ? 'on' : '') + '" data-a="' + action + '" data-v="' + i[0] + '">' + i[1] + '</button>';
    }).join('') + '</div>';
  }
  function pctClass(p) { return p >= 1 ? 'over' : p >= 0.8 ? 'warn' : 'ok'; }

  function budgetBody() {
    var st = S.get(), by = S.byGroup(V.ym, 'expense'), bud = st.budgets;
    var rows = Cat.groups.filter(function (g) { return g.kind === 'e'; }).map(function (g) {
      return { g: g, spent: by[g.id] ? by[g.id].total : 0, limit: bud[g.id] || 0 };
    });
    var withL = rows.filter(function (r) { return r.limit > 0; }).sort(function (a, b) { return b.spent / b.limit - a.spent / a.limit; });
    var noL = rows.filter(function (r) { return !r.limit && r.spent > 0; }).sort(function (a, b) { return b.spent - a.spent; });
    var free = rows.filter(function (r) { return !r.limit && !r.spent; });
    var totL = U.sum(withL, function (r) { return r.limit; }), totS = U.sum(withL, function (r) { return r.spent; });
    var out = '';

    if (totL) {
      var p = totS / totL;
      out += '<div class="card sumcard"><div class="sum-top"><div><small>Orçamento de ' + U.monthName(V.ym).toLowerCase() + '</small><b>' + M(totS) + '</b><small>de ' + M(totL) + '</small></div>' +
        '<span class="pct ' + pctClass(p) + ' big">' + Math.round(p * 100) + '%</span></div>' +
        '<div class="bar"><i class="' + pctClass(p) + '" style="width:' + Math.min(100, p * 100) + '%"></i></div>' +
        '<small class="' + (totL - totS < 0 ? 'neg' : '') + '">' + (totL - totS >= 0 ? 'Restam ' + M(totL - totS) : 'Estourou em ' + M(totS - totL)) + '</small></div>';
    } else {
      out += '<div class="card soft slim">' + icon('target', 20) + '<span>Defina um limite mensal por categoria e acompanhe o quanto já gastou.</span></div>';
    }

    function brow(r) {
      var p = r.limit ? r.spent / r.limit : 0;
      return '<button class="brow" data-a="budget" data-g="' + r.g.id + '">' + groupBadge(r.g) + '<span class="bm"><span class="bt"><b>' + esc(r.g.name) + '</b>' +
        (r.limit ? '<span class="pct ' + pctClass(p) + '">' + Math.round(p * 100) + '%</span>' : '<span class="lnk">Definir limite</span>') + '</span>' +
        '<span class="bar"><i class="' + (r.limit ? pctClass(p) : '') + '" style="width:' + (r.limit ? Math.min(100, p * 100) : 0) + '%;--c:' + r.g.color + '"></i></span>' +
        '<small>' + M(r.spent) + (r.limit ? ' de ' + M(r.limit) + (r.limit >= r.spent ? ' · restam ' + M(r.limit - r.spent) : ' · passou ' + M(r.spent - r.limit)) : ' gastos sem limite') + '</small></span></button>';
    }
    if (withL.length) out += '<div class="sec"><h2>Seus limites</h2></div><div class="list card flush">' + withL.map(brow).join('') + '</div>';
    if (noL.length) out += '<div class="sec"><h2>Gastos sem limite</h2></div><div class="list card flush">' + noL.map(brow).join('') + '</div>';
    if (free.length) out += '<div class="sec"><h2>Criar limite</h2></div><div class="chips wrap">' + free.map(function (r) {
      return '<button class="chip" data-a="budget" data-g="' + r.g.id + '">' + icon('plus', 14) + esc(r.g.name) + '</button>';
    }).join('') + '</div>';

    // equilíbrio financeiro 50/30/20
    var inc = S.totals(V.ym).inc, bk = { ess: 0, non: 0, inv: 0 };
    Object.keys(by).forEach(function (gid) { var g = Cat.group(gid); if (g.bucket) bk[g.bucket] += by[gid].total; });
    var defs = [['ess', 'Gastos essenciais', 0.5, 'Moradia, alimentação, saúde, transporte e educação'], ['non', 'Gastos não essenciais', 0.3, 'Compras, lazer, serviços digitais e outros'], ['inv', 'Investimentos e finanças', 0.2, 'Aportes, reserva e demais movimentos financeiros']];
    out += '<div class="sec"><h2>Equilíbrio financeiro</h2><span class="hint">50 · 30 · 20</span></div><div class="card bal503020">';
    if (!inc) out += '<p class="muted">Registre suas receitas deste mês para ver quanto cada grupo de gastos deveria ocupar.</p>';
    else defs.forEach(function (d) {
      var lim = Math.round(inc * d[2]), p = lim ? bk[d[0]] / lim : 0;
      out += '<div class="eq"><div class="eq-t"><b>' + d[1] + '</b><span>' + M(bk[d[0]]) + '</span></div><div class="bar"><i class="' + pctClass(p) + '" style="width:' + Math.min(100, p * 100) + '%"></i></div>' +
        '<div class="eq-b"><small>' + d[3] + '</small><small>Limite recomendado: <b>' + M(lim) + '</b></small></div></div>';
    });
    return out + '</div>';
  }

  function nice(max) {
    if (max <= 0) return 100000;
    var p = Math.pow(10, Math.floor(Math.log10(max))), f = max / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function compact(c) {
    var v = c / 100;
    if (v >= 1000) { var k = v / 1000; return (Math.round(k * 10) / 10).toString().replace('.', ',') + ' mil'; }
    return Math.round(v).toString();
  }

  function donut(items, total) {
    var R = 78, C = 2 * Math.PI * R, acc = 0, segs = '';
    if (!total) segs = '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke="var(--line)" stroke-width="26"/>';
    else items.forEach(function (it) {
      var len = it.total / total * C, gap = items.length > 1 ? Math.min(3, len * 0.3) : 0;
      segs += '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke="' + it.g.color + '" stroke-width="26" stroke-dasharray="' + Math.max(0, len - gap).toFixed(2) + ' ' + (C - len + gap).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 100 100)"/>';
      acc += len;
    });
    return '<svg viewBox="0 0 200 200" class="donut" role="img" aria-label="Gráfico por categoria">' + segs + '</svg>';
  }

  function barChart(series) {
    var W = 340, H = 190, top = 14, base = 150, left = 34, right = 8;
    var max = nice(Math.max.apply(null, series.map(function (s) { return Math.max(s.inc, s.exp); }).concat([1])));
    var step = (W - left - right) / series.length, bw = 13, out = '';
    function y(v) { return base - (v / max) * (base - top); }
    [0, 0.5, 1].forEach(function (f) {
      var yy = y(max * f);
      out += '<line x1="' + left + '" x2="' + (W - right) + '" y1="' + yy + '" y2="' + yy + '" class="gl"/><text x="' + (left - 6) + '" y="' + (yy + 3.5) + '" class="gt" text-anchor="end">' + (f === 0 ? '0' : compact(max * f)) + '</text>';
    });
    series.forEach(function (s, i) {
      var cx = left + step * i + step / 2, on = s.ym === V.ym;
      if (on) out += '<rect x="' + (cx - step / 2 + 3) + '" y="' + (top - 6) + '" width="' + (step - 6) + '" height="' + (base - top + 28) + '" rx="8" class="sel-bg"/>';
      var hi = Math.max(s.inc ? base - y(s.inc) : 0, 0), he = Math.max(s.exp ? base - y(s.exp) : 0, 0);
      out += '<rect x="' + (cx - bw - 1.5) + '" y="' + (base - hi) + '" width="' + bw + '" height="' + hi + '" rx="3" class="b-inc"/>' +
        '<rect x="' + (cx + 1.5) + '" y="' + (base - he) + '" width="' + bw + '" height="' + he + '" rx="3" class="b-exp"/>' +
        '<text x="' + cx + '" y="' + (base + 18) + '" text-anchor="middle" class="bl' + (on ? ' on' : '') + '">' + U.monthShort(s.ym) + '</text>' +
        '<rect x="' + (cx - step / 2) + '" y="0" width="' + step + '" height="' + H + '" fill="transparent" data-a="bar" data-ym="' + s.ym + '" style="cursor:pointer"><title>' + U.monthName(s.ym) + '</title></rect>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="bars" role="img" aria-label="Ganhos e gastos dos últimos 6 meses">' + out + '</svg>';
  }

  function reportBody() {
    var type = V.rep, by = S.byGroup(V.ym, type);
    var items = Object.keys(by).map(function (gid) { return { g: Cat.group(gid), total: by[gid].total, cats: by[gid].cats }; }).sort(function (a, b) { return b.total - a.total; });

    var prev = U.sum(Object.keys(S.byGroup(U.addMonths(V.ym, -1), type)), function (k) { return S.byGroup(U.addMonths(V.ym, -1), type)[k].total; });
    var out = seg([['expense', 'Despesas'], ['income', 'Receitas']], type, 'rep-type');

    var delta = '';
    if (prev && total) {
      var d = (total - prev) / prev, good = type === 'income' ? d >= 0 : d <= 0;
      delta = '<small class="delta ' + (good ? 'pos' : 'neg') + '">' + (d >= 0 ? '▲' : '▼') + ' ' + Math.abs(Math.round(d * 100)) + '% em relação a ' + U.monthName(U.addMonths(V.ym, -1)).toLowerCase() + '</small>';
    }
    out += '<div class="card donut-card"><div class="donut-wrap">' + donut(items, total) +
      '<div class="donut-c"><small>' + (type === 'income' ? 'Receitas' : 'Despesas') + '</small><b>' + M(total) + '</b></div></div>' + delta + '</div>';

    if (items.length) {
      out += '<div class="list card flush legend">' + items.map(function (it) {
        var cats = Object.keys(it.cats).map(function (id) { return [Cat.get(id), it.cats[id]]; }).sort(function (a, b) { return b[1] - a[1]; });
        return '<details><summary><span class="ci" style="--c:' + it.g.color + '">' + icon(it.g.icon, 18) + '</span><span class="rm"><b class="rt">' + esc(it.g.name) + '</b>' +

          '<span class="ra"><b>' + M(it.total) + '</b><small>' + (it.total / total * 100).toFixed(1).replace('.', ',') + '%</small></span></summary>' +
          '<ul>' + cats.map(function (c) { return '<li><span>' + esc(c[0].name) + '</span><b>' + M(c[1]) + '</b></li>'; }).join('') + '</ul></details>';
      }).join('') + '</div>';

      '<div class="chart-sum"><div><small>Ganhos em ' + U.monthShort(V.ym).toLowerCase() + '.</small><b class="pos">' + M(cur.inc) + '</b></div><div><small>Gastos em ' + U.monthShort(V.ym).toLowerCase() + '.</small><b class="neg">' + M(cur.exp) + '</b></div>' +
      '<div><small>Resultado</small><b class="' + (cur.inc - cur.exp >= 0 ? 'pos' : 'neg') + '">' + M(cur.inc - cur.exp) + '</b></div></div></div>';

    var top = S.monthTx(V.ym).filter(function (t) { return t.type === type && t.kind !== 'invoice'; }).sort(function (a, b) { return b.amount - a.amount; }).slice(0, 5);
    if (top.length) out += '<div class="sec"><h2>Maiores ' + (type === 'income' ? 'receitas' : 'gastos') + '</h2></div><div class="list card flush">' + top.map(function (t) { return txRow(t, true); }).join('') + '</div>';
    return out;
  }

  function orcamento() {

  /* ---------- contas e cartões ---------- */
  var TYPES = { checking: 'Conta corrente', savings: 'Poupança', cash: 'Dinheiro', invest: 'Investimentos' };
  G.ACCOUNT_TYPES = TYPES;

  function contas() {

      '<div class="bal"><div><small>Saldo geral</small><strong>' + M(total) + '</strong></div></div></header>';

        '<div class="ccard-nums"><div><small>Disponível</small><b>' + M(Math.max(0, c.limit - used)) + '</b></div><div><small>Fatura de ' + U.monthName(ym).toLowerCase() + '</small><b class="neg">' + M(inv.total) + '</b></div>' +

    return h + b + '</main>';

  var STATUS = { open: ['Aberta', 'info'], closed: ['Fechada', 'warn'], overdue: ['Vencida', 'over'], paid: ['Paga', 'ok'] };

  function fatura(parts) {
    var card = S.card(parts[1]);
    if (!card) return subHeader('Fatura') + '<main class="page">' + empty('card', 'Cartão não encontrado', 'Ele pode ter sido excluído.') + '</main>';
    var ym = parts[2] || S.currentInvoiceYm(card.id), inv = S.invoice(card.id, ym), stt = STATUS[inv.status];
    var h = subHeader('Detalhes da fatura', '<button class="ibtn" data-a="card-edit" data-id="' + card.id + '" aria-label="Editar cartão">' + icon('edit', 20) + '</button>') ;
    function tab(m, cur) { return '<button class="' + (cur ? 'on' : '') + '" data-a="go" data-r="fatura/' + card.id + '/' + m + '" data-replace="1">' + (cur ? U.monthName(m) : U.monthShort(m)) + (m.slice(0, 4) !== ym.slice(0, 4) ? ' ' + (cur ? m.slice(0, 4) : '’' + m.slice(2, 4)) : '') + '</button>'; }

    var cardBg = 'background:linear-gradient(135deg,' + card.color + ',color-mix(in srgb,' + card.color + ' 55%,#000));color:' + fgOn(card.color);
    var b = '<main class="page pull"><div class="inv"><div class="inv-card" style="' + cardBg + '"><div class="inv-top"><span class="pill ' + stt[1] + '">' + stt[0] + '</span>' + icon('card', 22) + '</div>' +
      '<b>Cartão ' + esc(card.name) + '</b><div class="inv-dates"><span><small>Fecha em</small>' + U.dayShort(inv.close) + '</span><span><small>Vence em</small>' + U.dayShort(inv.due) + '</span></div></div>' +
      '<div class="inv-sum"><div><small>Valor da fatura</small><b class="neg">' + M(inv.total) + '</b></div><div><small>Limite disponível</small><b>' + M(Math.max(0, card.limit - S.cardUsed(card.id))) + '</b></div>' +
